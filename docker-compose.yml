x-cno-comum: &cno-comum
  build:
    context: .
    dockerfile: Dockerfile
  image: cno-pipeline:0.1.0
  environment: &cno-ambiente
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-cno-desenvolvimento-jwt}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    CNO_LOG_JSON: '1'
    CNO_MANTER_ZIP: '0'
    CNO_MANTER_INTERMEDIARIOS: '0'
    CNO_DUCKDB_MEMORY: ${CNO_DUCKDB_MEMORY:-4GB}
    CNO_DUCKDB_THREADS: ${CNO_DUCKDB_THREADS:-4}
  volumes:
    - cno-dados:/opt/cno/data
    - airflow-logs:/opt/airflow/logs
  depends_on: &cno-depende-de
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  # Pipeline com orquestrador
  airflow-init:
    <<: *cno-comum
    command: version
    environment:
      <<: *cno-ambiente
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USUARIO:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_SENHA:-airflow}
    restart: "no"

  airflow-apiserver:
    <<: *cno-comum
    command: api-server
    ports:
      - "${AIRFLOW_PORTA:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *cno-depende-de
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *cno-comum
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *cno-depende-de
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *cno-comum
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *cno-depende-de
      airflow-init:
        condition: service_completed_successfully

  # Pipeline sem orquestrador, para demonstração rápida
  cno:
    <<: *cno-comum
    profiles: ["cli"]
    entrypoint: ["/opt/cno/.venv/bin/cno"]
    command: ["info"]
    environment:
      <<: *cno-ambiente
      # Em execução manual o log legível vale mais que o JSON, que existe para
      # o orquestrador consumir.
      CNO_LOG_JSON: '0'
    depends_on: []

  # Dashboard de apresentação
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: cno-pipeline:0.1.0
    entrypoint: ["/opt/cno/.venv/bin/streamlit"]
    command:
      - run
      - /opt/cno/app/dashboard.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      CNO_DUCKDB_MEMORY: ${CNO_DUCKDB_MEMORY:-4GB}
      CNO_DUCKDB_THREADS: ${CNO_DUCKDB_THREADS:-4}
    ports:
      - "${DASHBOARD_PORTA:-8501}:8501"
    volumes:
      - cno-dados:/opt/cno/data:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-dados:
  cno-dados:
  airflow-logs:
