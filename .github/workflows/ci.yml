# Integração contínua. Os jobs chamam `make`, os mesmos comandos do README, para
# testar a instalação que as pessoas de fato usam. Tudo roda offline e sem segredo.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: lint e testes (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 é o mínimo do `requires-python`; 3.12 é o do desenvolvimento e da imagem.
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Lint e formatação
        run: make lint

      - name: Testes
        run: make test

  dags:
    name: testes das DAGs (Airflow 3.3.2)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Venv separado porque as versões fixadas pelo Airflow conflitam com as do pipeline.
      - name: Instalar o Airflow num venv próprio
        run: |
          python -m venv "$HOME/.venvs/airflow"
          "$HOME/.venvs/airflow/bin/pip" install --upgrade pip --quiet
          "$HOME/.venvs/airflow/bin/pip" install --quiet \
            "apache-airflow==3.3.2" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"
          "$HOME/.venvs/airflow/bin/pip" install --quiet "pytest>=8.0"

      - name: Instalar o pipeline no venv do Airflow
        run: '"$HOME/.venvs/airflow/bin/pip" install -e . --quiet'

      # Os testes de DAG consultam o banco de metadados. `AIRFLOW_HOME` tem de ser
      # o mesmo que o Makefile usa em `test-dag`.
      - name: Inicializar o banco de metadados do Airflow
        env:
          AIRFLOW_HOME: /home/runner/airflow
        run: '"$HOME/.venvs/airflow/bin/airflow" db migrate'

      - name: Testes das DAGs
        run: make test-dag
