# CD da trilha de nuvem. A cada push nesta branch a imagem é reconstruída e o job
# e o dashboard passam a usá-la. A autenticação é OIDC, sem segredo no
# repositório, e os cinco valores usados são Variables públicas. O build é no
# runner porque esta assinatura tem ACR Tasks bloqueado.
name: nuvem

on:
  push:
    branches: [cloud/azure]
  workflow_dispatch:

# `id-token: write` permite ao runner emitir o token OIDC.
permissions:
  id-token: write
  contents: read

concurrency:
  group: nuvem
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      IMAGEM: cno-pipeline

    steps:
      - uses: actions/checkout@v4

      # Com uma Variable vazia o azure/login falha sem dizer qual delas é. O
      # engano mais provável é cadastrar em Secrets, que é a mesma tela.
      - name: conferir que as Variables do repositório existem
        run: |
          faltando=""
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_REGISTRY; do
            eval "valor=\${$v:-}"
            [ -n "$valor" ] || faltando="$faltando $v"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Variables ausentes ou vazias:$faltando"
            echo "Cadastre em Settings > Secrets and variables > Actions > aba Variables"
            echo "(aba Variables, NAO Secrets: o workflow le com vars.*)"
            exit 1
          fi
          echo "as cinco Variables estao presentes"
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_REGISTRY: ${{ vars.AZURE_REGISTRY }}

      - name: autenticar na Azure por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: autenticar no registry
        run: az acr login --name ${{ vars.AZURE_REGISTRY }}

      - name: construir e empurrar a imagem
        run: |
          set -euo pipefail
          REG="${{ vars.AZURE_REGISTRY }}.azurecr.io"
          docker build \
            --file nuvem/Dockerfile \
            --tag "$REG/$IMAGEM:${{ github.sha }}" \
            --tag "$REG/$IMAGEM:latest" \
            .
          docker push "$REG/$IMAGEM:${{ github.sha }}"
          docker push "$REG/$IMAGEM:latest"

      # A tag do commit amarra cada revisão a um código exato. O `latest` só
      # serve ao primeiro apply do Terraform.
      - name: apontar o job e o dashboard para a nova imagem
        run: |
          set -euo pipefail
          # Sem isto o az pede confirmação para instalar a extensão e trava.
          az config set extension.use_dynamic_install=yes_without_prompt
          REG="${{ vars.AZURE_REGISTRY }}.azurecr.io"
          az containerapp job update \
            --name job-cno-pipeline \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$REG/$IMAGEM:${{ github.sha }}"
          az containerapp update \
            --name ca-cno-dashboard \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$REG/$IMAGEM:${{ github.sha }}"
