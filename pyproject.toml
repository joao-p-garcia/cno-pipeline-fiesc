[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cno-pipeline"
version = "0.1.0"
description = "Pipeline de extração e tratamento da base do CNO (Cadastro Nacional de Obras)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    # Engine do tratamento. Escolhido em vez de pandas porque os 3,6 M de linhas
    # cabem em memória com folga no DuckDB e estourariam vários GB no pandas, e
    # porque ele escreve parquet particionado nativamente.
    "duckdb>=1.1",
    # Implementação de referência do Open Location Code, do Google. Python puro,
    # sem dependências transitivas. É o que permite geocodificar os Plus Codes do
    # `Código de localização` sem chamar nenhum serviço externo pago.
    "openlocationcode>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
cno = "cno_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: testes que fazem requisições reais à Receita Federal (desabilitados por padrão)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
