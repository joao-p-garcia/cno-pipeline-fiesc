[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cno-pipeline"
version = "0.1.0"
description = "Pipeline de extração e tratamento da base do CNO (Cadastro Nacional de Obras)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "duckdb>=1.1",
    "openlocationcode>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "vl-convert-python>=1.7",
]
dashboard = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "altair>=5.4",
]
notebook = [
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[project.scripts]
cno = "cno_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: testes que fazem requisições reais à Receita Federal (desabilitados por padrão)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
